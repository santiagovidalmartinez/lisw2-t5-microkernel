# Registro de plugins del Microkernel del Banco de Preguntas.
# Formato: plugin.<n> = nombre completo de la clase (paquete incluido)
#
# El nucleo (QuestionMicrokernel) lee este archivo y usa REFLEXION
# (Class.forName + newInstance) para instanciar cada clase aqui listada,
# tal como se hizo en el ejemplo de teoria "delivery.<pais> = clase"
# para el calculo de costos de envio en distintos paises.
#
# Para agregar un plugin nuevo NO se modifica QuestionMicrokernel:
# solo se agrega una linea aqui.

plugin.1=co.edu.unicauca.microkernel.plugins.MultipleChoiceQuestionPlugin
plugin.2=co.edu.unicauca.microkernel.plugins.CaseQuestionPlugin
plugin.3=co.edu.unicauca.microkernel.plugins.MultimediaQuestionPlugin
